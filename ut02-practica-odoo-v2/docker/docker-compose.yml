# Odoo 17 + PostgreSQL 16 con Docker Compose (UT02 · Práctica 2 · §8, variante Docker)
# Carpeta en el servidor: /home/alumno/odoo-docker
# Odoo en el puerto 8070 del anfitrión (el 8069 lo usa el Odoo instalado desde el código fuente).
version: "3.1"

services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      # persistencia de PostgreSQL, como en el enunciado
      - ./volumesOdoo/dataPostgreSQL:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    image: odoo:17
    depends_on:
      - db
    ports:
      - "8070:8069"
    environment:
      - HOST=db        # nombre del servicio de PostgreSQL dentro de la red de Compose
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      # las tres carpetas que pide copiar el enunciado
      - ./volumesOdoo/addons:/mnt/extra-addons
      - ./volumesOdoo/filestore:/var/lib/odoo/filestore
      - ./volumesOdoo/sessions:/var/lib/odoo/sessions
      # /etc/odoo/odoo.conf NO se mapea: se saca con «docker cp», como en el enunciado
    restart: unless-stopped
